[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-nlp-pipeline"
version = "0.1.0"
description = "A comprehensive PySpark NLP pipeline and ETL library"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "wonhyeok kim", email = "novatecoder@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspark>=3.0.0",
    "click>=8.0",
    # tomli 제거됨
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[project.scripts]
pyspark-nlp-pipeline = "pyspark_nlp_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]